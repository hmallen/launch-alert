[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launch-alert"
version = "1.0.0"
description = "Persistent rocket launch livestream reminders via ntfy"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
launch-alert = "launch_alert.__main__:main"

[tool.setuptools.packages.find]
include = ["launch_alert*"]
